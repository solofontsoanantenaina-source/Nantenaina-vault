name: Build NANTENAINA APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Generate NANTENAINA Project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/nantenaina/vault
          echo 'include(":app")' > settings.gradle.kts
          echo 'rootProject.name="Nantenaina-vault"' >> settings.gradle.kts
          echo 'plugins{id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.10" apply false}' > build.gradle.kts
          echo 'plugins{id("com.android.application"); id("org.jetbrains.kotlin.android")} android{namespace="com.nantenaina.vault";compileSdk=34;defaultConfig{applicationId="com.nantenaina.vault";minSdk=26;targetSdk=34;versionCode=1;versionName="1.0"}} dependencies{implementation("androidx.core:core-ktx:1.12.0");implementation("androidx.appcompat:appcompat:1.6.1");implementation("com.google.android.material:material:1.11.0");implementation("androidx.biometric:biometric:1.1.0")}' > app/build.gradle.kts
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="NANTENAINA"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/nantenaina/vault/MainActivity.kt <<'KT'
          package com.nantenaina.vault
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.*
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val l = LinearLayout(this).apply{ orientation = LinearLayout.VERTICAL; setPadding(80,300,80,80) }
              val t = TextView(this).apply{ text = "🐱 NANTENAINA\nVAULT\n💖"; textSize = 32f; textAlignment = TextView.TEXT_ALIGNMENT_CENTER }
              val btn = Button(this).apply{ text = "Unlock Vault" }
              l.addView(t); l.addView(btn); setContentView(l)
              btn.setOnClickListener{ Toast.makeText(this,"Tongasoa Nantenaina! Unlocked!",Toast.LENGTH_LONG).show() }
            }
          }
          KT
          echo "distributionUrl=https://services.gradle.org/distributions/gradle-8.4-bin.zip" > gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NANTENAINA-APK
          path: app/build/outputs/apk/debug/*.apk
