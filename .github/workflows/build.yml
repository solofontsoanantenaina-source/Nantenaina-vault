name: Build NANTENAINA APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create project with Groovy (no error)
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/nantenaina/vault
          echo "include ':app'" > settings.gradle
          echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.nantenaina.vault'
            compileSdk 34
            defaultConfig { applicationId 'com.nantenaina.vault'; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          EOF
          echo '<?xml version="1.0"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="NANTENAINA"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.nantenaina.vault; import android.app.Activity; import android.os.Bundle; import android.widget.*; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); LinearLayout l=new LinearLayout(this); l.setOrientation(1); TextView t=new TextView(this); t.setText("🐱 NANTENAINA VAULT"); t.setTextSize(28); l.addView(t); setContentView(l); } }' > app/src/main/java/com/nantenaina/vault/MainActivity.java
      - name: Build with Gradle 8.4
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NANTENAINA-APK
          path: app/build/outputs/apk/debug/*.apk
